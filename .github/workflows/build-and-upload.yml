name: Build and upload
run-name: Build and upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codefreeze-*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Production UI Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Compile Application
        run: pnpm run build:local

      - name: Upload UI Binaries
        uses: actions/upload-artifact@v4
        with:
          name: temporal-ui-production-build
          # Targets the entire directory but safely ignores massive source/cache paths
          path: |
            .
            !node_modules/
            !.git/
            !.github/
          retention-days: 7
